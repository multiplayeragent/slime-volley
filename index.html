<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #7ec8e3; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }

  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 5px #0006; left: 0; right: 0; text-align: center; }
  #score { top: max(8px, env(safe-area-inset-top)); display: flex; justify-content: center; align-items: flex-start; gap: 18px; }

  #score i { font: 700 13px/44px system-ui, sans-serif; font-style: normal; opacity: .85; }
  #hint { top: calc(max(8px, env(safe-area-inset-top)) + 70px); font-size: 14px; font-weight: 600; transition: opacity 1s; }
  #msg { top: 34%; transform: translateY(-50%); font: 900 min(14vw, 72px)/1 system-ui, sans-serif; -webkit-text-stroke: 2px #0003; opacity: 0; transition: opacity .2s, transform .2s; }
  #msg small { display: block; margin-top: 8px; font-size: 18px; font-weight: 700; -webkit-text-stroke: 0; }

  #net { bottom: max(6px, env(safe-area-inset-bottom)); font-size: 12px; opacity: .85; }

  .pad button { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #ffffffaa; background: #ffffff38; color: #fff; font: 900 22px system-ui, sans-serif; touch-action: none; text-shadow: 0 1px 3px #0005; }

  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 22px; border-radius: 18px; background: #0f3a52; border: 1px solid #ffffff33; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 28px; }

</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>

<body>
<canvas id="game"></canvas>
<div class="hud" id="score"><div class="side"><b id="s0">0</b><small id="n0"></small></div><i id="to"></i><div class="side"><b id="s1">0</b><small id="n1"></small></div></div>
<div class="hud" id="hint"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="net">Connecting…</div>
<div class="pad" id="move" hidden><button data-k="left">◀</button><button data-k="right">▶</button></div>

<div id="over" hidden><div class="card">
  <h2 id="winner"></h2><div id="final"></div>
  <h3>Most wins</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ SLIME VOLLEY · a Multiplayer Agent starter ═══════════════════════════════════════
 * Half-circle slimes jump to bounce a volleyball over the net. Don't let it land on your
 * side. First to 7. Versus, 2–4 players: 1 a side, 2 a side when 3 or more are here;
 * bots fill the empty spots, so alone you play a bot.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ points to win, court and net size, jumping, the ball's bounce, the bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   COURT ......... sizes, where each slime stands, moving a slime
 *   PHYSICS ....... the ball: gravity, slimes, the net, walls, the sand (the host and everyone's prediction use it)
 *   MATCH (HOST) .. sides, score, serves, the winner. Only the host writes these.
 *   BOTS .......... the bot brain: guess where the ball comes down, get behind it, jump to spike
 *   ME ............ running and jumping, my own hits on the ball
 *   DRAW .......... beach, net, slimes whose eyes follow the ball, the ball and its shadow
 *   HUD & RESULTS . score, messages, results card, leaderboard
 *   INPUT ......... keyboard, and ◀ ▶ JUMP buttons on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` {x, y, vx, vy} (its slime, in court units) about
 *     15 times a second, `hb` (heartbeat) once a second, `rdy` (Play again), `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked
 *     out every frame. Only the host writes the shared fields:
 *       `game` {id, v, phase, teams, score, pt, serve, serveAt, resumeAt, win, overAt, last}: who
 *              plays on which side (sessionIds, or bot ids "b1".."b4"), the score, the serve.
 *              `v` goes up on every write; `pt` counts points (everyone walks back to their spot).
 *       `ball` {x, y, vx, vy, h, s, z, b}: the ball ~15 times a second (h = hits so far, s = write
 *              number, z = 1 while it hangs for a serve, b = the bot slimes).
 *   - The host moves the ball against gravity, the net, the walls, its own slime and the bots.
 *     Everyone else runs the ball on their own screen between writes and decides THEIR OWN hits:
 *     when your slime touches the ball on your screen, it bounces at once and you send "hit"
 *     {x, y, vx, vy, g, pt}; the host checks it is plausible and adopts it. A ball that lands on
 *     your side on the host's screen waits `groundGrace` ms for your save before it counts.
 *   - Someone new takes a bot's spot and a fresh match starts; someone who leaves is replaced
 *     by a bot and the match goes on. A new host adopts `game` and `ball` and carries on.
 *   - ?attract plays offline, bots only, two a side (the preview video is recorded from it).
 *   - Leaderboard "wins": each match your side wins adds 1 to your total.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  pointsToWin: 7,
  teamSize: 1,          // slimes a side while 1–2 people are here (bots fill the rest)
  maxTeam: 2,           // with 3–4 people it's two a side
  courtW: 1000,         // court width in court units (the net is in the middle)
  netH: 130, netW: 14,  // net height and thickness
  slimeR: 72, ballR: 21,
  gravity: 1150,        // pulls the ball down, units/s²
  slimeGravity: 2700,   // pulls slimes down (heavier than the ball: snappy jumps)
  jump: 930,            // a slime's jump speed, units/s
  runSpeed: 440,        // units/s
  pop: 640,             // a slime always sends the ball away at least this fast
  bounce: 0.95,         // how much speed a bounce off a slime keeps
  wallBounce: 0.85,     // ... off a wall or the net
  maxBall: 1250,        // fastest the ball can go, units/s
  botSpeed: 0.86,       // bots run at this share of top speed
  botError: 26,         // how far off bots stand, units
  botThink: 130,        // ms between bot decisions
  botSpike: 0.5,        // chance a bot by the net jumps to smash a ball coming down
  botJump: 0.25,        // chance a bot further back jumps to hit a ball harder
  botMiss: 0.12,        // chance a bot misreads where a ball will come down
  botReact: 260,        // ms a bot takes to react after each touch (it keeps going where it was going)
  servePause: 1000,     // ms the ball hangs before a serve drops
  pointMs: 1300,        // ms after a point before the next serve
  resultsMs: 9000,      // ms on the results card before the next match
  sendMs: 66,           // my slime and the ball (~15 a second)
  groundGrace: 180,     // ms someone else has to save a ball that landed on their side on the host's screen
  board: "wins",
};
const SIDE_COLORS = ["#ff7a59", "#2ec4b6"], SIDE_NAMES = ["Coral", "Lagoon"]; // left side, right side
const COLORS = ["#ff5d8f", "#ffd23f", "#3a86ff", "#06d6a0", "#b388ff", "#ff9f1c", "#8ac926", "#f15bb5"]; // each person's slime
const BOT_NAMES = ["", "Gloop", "Bouncer", "Jelly", "Splat"]; // bot "b2" is Bouncer; bots wear the colors no person has

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'slime-volley',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch

// ── COURT ───────────────────────────────────────────────────────────────────────────
// Court units: x runs -HW..HW (the net at 0), y is height above the sand (up is +).
// Side 0 (Coral) plays on the left, side 1 (Lagoon) on the right.
const HW = CONFIG.courtW / 2, NW = CONFIG.netW / 2, R = CONFIG.slimeR;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const away = (team) => (team === 0 ? -1 : 1); // which way from the net a side's half is
const HOMES = { 1: [250], 2: [370, 135] };     // how far from the net each slime stands, for 1 or 2 a side
const homeOf = (team, i, size) => away(team) * ((HOMES[size] || HOMES[2])[i] ?? 250);
/** Run and jump a slime (dir -1..1, jump = pressed), kept on its own side of the net. */
function moveSlime(s, dir, jump, dt, team, speedShare) {
  s.vx = dir * CONFIG.runSpeed * speedShare;
  if (jump && s.y <= 0) { s.vy = CONFIG.jump; s.hop = 1; }
  s.vy -= CONFIG.slimeGravity * dt; s.x += s.vx * dt; s.y += s.vy * dt;
  if (s.y <= 0) { if (s.vy < -500) s.land = 1; s.y = 0; s.vy = 0; }
  s.x = team === 0 ? clamp(s.x, -HW + R, -NW - R * 0.85) : clamp(s.x, NW + R * 0.85, HW - R);
}
/** Teammates don't overlap: push slime `s` sideways out of `o` by half the overlap. */
function pushApart(s, o) {
  const dx = s.x - o.x, dy = s.y - o.y, d = Math.hypot(dx, dy), min = R * 1.8;
  if (d < min && d > 0.001) s.x += (dx / d) * (min - d) * 0.5;
}

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
/** Move the ball dt seconds: gravity, `slimes` ({x, y, vx, vy}), the net, the walls, the sand.
 *  Returns { hit: the slime that hit it or null, wall, net, ground: the side it landed on, or -1 }. */
function stepBall(b, dt, slimes) {
  const out = { hit: null, wall: false, net: false, ground: -1 }, r = CONFIG.ballR;
  const n = Math.max(1, Math.ceil((Math.hypot(b.vx, b.vy) * dt) / 6));
  for (let i = 0; i < n; i++) {
    const h = dt / n;
    b.vy -= CONFIG.gravity * h; b.x += b.vx * h; b.y += b.vy * h;
    for (const s of slimes) { // a slime is a dome: bounce off its round top
      const dx = b.x - s.x, dy = b.y - s.y, d = Math.hypot(dx, dy), min = r + R;
      if (d >= min || d < 0.001 || dy < -r * 0.5) continue;
      const nx = dx / d, ny = dy / d, rel = (b.vx - s.vx) * nx + (b.vy - s.vy) * ny;
      b.x = s.x + nx * min; b.y = s.y + ny * min;
      const want = Math.max(-rel * CONFIG.bounce, CONFIG.pop); // always pops off at a decent speed
      if (rel < want) { b.vx += (want - rel) * nx; b.vy += (want - rel) * ny; out.hit = s; }
    }
    const cx = clamp(b.x, -NW, NW), cy = clamp(b.y, 0, CONFIG.netH), ndx = b.x - cx, ndy = b.y - cy, nd = Math.hypot(ndx, ndy);
    if (nd < r) { // the net (a post with a flat top)
      const nx = nd > 0.001 ? ndx / nd : Math.sign(b.x) || 1, ny = nd > 0.001 ? ndy / nd : 0, rel = b.vx * nx + b.vy * ny;
      b.x = cx + nx * r; b.y = cy + ny * r;
      if (rel < 0) { b.vx -= (1 + CONFIG.wallBounce) * rel * nx; b.vy -= (1 + CONFIG.wallBounce) * rel * ny; out.net = true; }
      if (ny > 0.9 && Math.abs(b.vx) < 40) b.vx = (b.x >= 0 ? 1 : -1) * 80; // never balance on top of the net
    }
    if (Math.abs(b.x) > HW - r) { b.x = Math.sign(b.x) * (HW - r); b.vx = -b.vx * CONFIG.wallBounce; out.wall = true; }
    if (b.y < r) { b.y = r; out.ground = b.x < 0 ? 0 : 1; b.vy = Math.abs(b.vy) * 0.45; b.vx *= 0.7; }
  }
  const sp = Math.hypot(b.vx, b.vy); if (sp > CONFIG.maxBall) { b.vx *= CONFIG.maxBall / sp; b.vy *= CONFIG.maxBall / sp; }
  return out;
}

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, wasHost: false, bots: new Map(), lastBall: 0, lastBody: "", pending: null };
let ball = { x: -250, y: 330, vx: 0, vy: 0, h: 0, s: 0, z: 1 }; // the host's real ball; everyone else's prediction of it
const isBot = (id) => /^b\d$/.test(id);
const teamOf = (g, id) => (g.teams[0].includes(id) ? 0 : g.teams[1].includes(id) ? 1 : -1);
/** The game as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = cached("game", S.shared.game, null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const teamSize = (people) => (people <= 2 ? CONFIG.teamSize : CONFIG.maxTeam);
/** Bots in every empty spot (null), and both sides filled up to `size`. */
function fillBots(teams, size) {
  const used = new Set(teams.flat());
  const newBot = () => { let k = 1; while (used.has("b" + k)) k++; used.add("b" + k); return "b" + k; };
  return teams.map((t) => { t = t.map((id) => id || newBot()); while (t.length < size) t.push(newBot()); return t.slice(0, Math.max(size, t.filter((id) => !isBot(id)).length)); });
}
/** A fresh match: the people here shuffled onto the two sides, bots in the gaps, 0–0. */
function newGame(id) {
  const people = humans().sort(() => Math.random() - 0.5), teams = [[], []];
  people.slice(0, CONFIG.maxTeam * 2).forEach((p, i) => teams[i % 2].push(p));
  const serve = Math.random() < 0.5 ? 0 : 1;
  return { id, phase: "play", teams: fillBots(teams, teamSize(people.length)), score: [0, 0], pt: 1, serve, serveAt: Date.now() + CONFIG.servePause + 900, resumeAt: 0, win: -1, overAt: 0, last: -1 };
}
/** Everyone to their spot (bots here; people move themselves when they see `pt` change) and the ball up over the server. */
function serveReset(g) {
  for (const b of host.bots.values()) { const k = teamOf(g, b.id); if (k >= 0) Object.assign(b, { x: homeOf(k, g.teams[k].indexOf(b.id), g.teams[k].length), y: 0, vx: 0, vy: 0 }); }
  const sx = homeOf(g.serve, 0, g.teams[g.serve].length) - away(g.serve) * 14; // a little toward the net, so a plain bump goes forward
  Object.assign(ball, { x: sx, y: 330, vx: 0, vy: 0, z: 1 }); host.pending = null; writeBall();
}
function writeBall(onlyIfMoved) {
  const r = Math.round, b = [...host.bots.values()].map((q) => [q.id, r(q.x), r(q.y), r(q.vx), r(q.vy)]);
  const body = JSON.stringify({ x: r(ball.x), y: r(ball.y), vx: r(ball.vx), vy: r(ball.vy), h: ball.h, z: ball.z, b });
  host.lastBall = performance.now();
  if (onlyIfMoved && body === host.lastBody) return; // nothing moved: save the message
  host.lastBody = body; ball.s++;
  net.setShared("ball", body.slice(0, -1) + `,"s":${ball.s}}`);
}
const newBotSlime = (id, x, y = 0, vx = 0, vy = 0) => ({ id, x, y, vx, vy, land: 0, hop: 0, thinkAt: 0, tx: x, jumpAt: 0, err: 0, seenH: -1, off: R * 0.38, miss: 0, reactAt: 0 });
/** Become host: take over the game, the ball and the bots exactly as state has them. */
function adopt() {
  host.wasHost = true; host.pending = null; host.bots.clear();
  const s = parse(S.shared.ball, null);
  if (s) { // our own screen has been running the ball on from this write: keep that (the write can be seconds old if the old host froze)
    if (s.s !== pred.lastS) Object.assign(ball, { x: s.x, y: s.y, vx: s.vx, vy: s.vy, h: s.h, z: s.z });
    ball.s = s.s;
    for (const [id, x, y, vx, vy] of s.b || []) host.bots.set(id, newBotSlime(id, x, y, vx, vy));
  }
}
/** host.bots holds exactly the bots on the court. */
function syncBots(g) {
  for (const id of g.teams.flat()) if (isBot(id) && !host.bots.has(id)) { const k = teamOf(g, id); host.bots.set(id, newBotSlime(id, homeOf(k, g.teams[k].indexOf(id), g.teams[k].length))); }
  for (const id of [...host.bots.keys()]) if (teamOf(g, id) < 0) host.bots.delete(id);
}
/** Seats: someone who left is replaced by a bot (the match goes on); someone new takes a bot's spot (a fresh match). */
function checkSeats(g) {
  const people = humans(), seated = g.teams.flat();
  const fresh = people.some((id) => !seated.includes(id)) && (seated.some(isBot) || teamSize(people.length) > g.teams[0].length);
  if (fresh && g.phase !== "over") { const n = writeGame(newGame(g.id + 1)); syncBots(n); serveReset(n); return n; }
  const teams = g.teams.map((t) => t.map((id) => (isBot(id) || people.includes(id) ? id : null)));
  if (!teams.flat().includes(null)) return g;
  const n = writeGame({ ...g, teams: fillBots(teams, g.teams[0].length) }); syncBots(n); return n;
}
/** The ball came down on `side`: a point for the other side, maybe the match. */
function scorePoint(g, side, t) {
  const team = 1 - side, score = [...g.score]; score[team]++;
  const win = score[team] >= CONFIG.pointsToWin ? team : -1;
  return writeGame({ ...g, phase: "point", score, serve: team, last: team, win, resumeAt: t + CONFIG.pointMs });
}
function hostTick(dt, now) {
  if (!host.wasHost) adopt();
  const t = Date.now();
  let g = game();
  if (!g) { g = writeGame(newGame(1)); syncBots(g); serveReset(g); }
  g = checkSeats(g); syncBots(g);
  if (g.phase === "point" && t >= g.resumeAt) {
    if (g.win >= 0) g = writeGame({ ...g, phase: "over", overAt: t + CONFIG.resultsMs });
    else { g = writeGame({ ...g, phase: "play", pt: g.pt + 1, serveAt: t + CONFIG.servePause }); serveReset(g); }
  }
  if (g.phase === "over") {
    const seated = g.teams.flat().filter((id) => !isBot(id));
    const ready = seated.length && seated.every((id) => (id === net.sessionId ? myReady : (S.entities.players[id] || {}).rdy) === g.id);
    if (t > g.overAt || ready) { g = writeGame(newGame(g.id + 1)); syncBots(g); serveReset(g); }
  }
  for (const b of host.bots.values()) botTick(b, g, dt, now, t);
  const live = g.phase === "play" && t >= g.serveAt;
  if (live || g.phase === "point") { // after a point the ball just bounces on the sand

    burst(ball.x, CONFIG.ballR, "#e8c98c", 22, 420, 0.7); burst(away(side) * 250, 300, SIDE_COLORS[g.last], 30, 520, 1.1); shake = 12;
    const mine = team === g.last;
    $("msg").innerHTML = g.win >= 0 ? `<span style="color:${SIDE_COLORS[g.win]}">GAME!</span>` : team < 0 ? `<span style="color:${SIDE_COLORS[g.last]}">POINT</span>` : mine ? `<span style="color:${SIDE_COLORS[g.last]}">POINT!</span>` : `<span style="color:#fff">Missed it!</span>`;
    msgUntil = now + CONFIG.pointMs; sfx(team < 0 || mine ? "point" : "lose");
  }
  if (seen.id !== g.id) msgUntil = 0;
  seen.score = score; seen.id = g.id;
  $("msg").classList.toggle("on", now < msgUntil);
  for (const k of [0, 1]) { $("s" + k).textContent = g.score[k]; $("s" + k).style.color = SIDE_COLORS[k]; $("n" + k).textContent = sideLabel(g, k); }
  $("to").textContent = `to ${CONFIG.pointsToWin}`;
  if (ATTRACT) { $("hint").textContent = $("net").textContent = $("to").textContent = ""; for (const k of [0, 1]) $("n" + k).textContent = ""; return; }
  $("hint").textContent = team < 0 ? "The court is full. You're in the next match." : `You're on the ${team === 0 ? "left" : "right"}. ${touchUI ? "◀ ▶ to move, JUMP to jump." : "A/D or arrows to move, W, ↑ or Space to jump."} Keep the ball off your sand!${touchUI && H > W ? " Turn your phone sideways for a bigger court." : ""}`;
  $("hint").style.opacity = now - startedAt < 8000 || team < 0 ? 1 : 0;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the ball" : ""}`;
  const card = g.phase === "over" && t > g.overAt - CONFIG.resultsMs + 1200;
  $("over").hidden = !card;
  if (card) {
    const won = team >= 0 && g.win === team;
    $("winner").textContent = won ? "You win!" : `${sideLabel(g, g.win)} win${g.teams[g.win].length > 1 || g.teams[g.win][0] === net.sessionId ? "" : "s"}!`;
    $("winner").style.color = SIDE_COLORS[g.win];
    $("final").innerHTML = `<span style="color:${SIDE_COLORS[0]}">${g.score[0]}</span> – <span style="color:${SIDE_COLORS[1]}">${g.score[1]}</span>`;
    $("again").hidden = team < 0;
    $("again").textContent = myReady === g.id ? "Waiting for the others…" : "Play again";
    $("next").textContent = `Next match in ${Math.max(0, Math.ceil((g.overAt - t) / 1000))}s`;
    if (boardFor !== g.id) { boardFor = g.id; showBoard(won); }
  }
}
function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (g && g.phase === "over") { myReady = g.id; net.me.set("rdy", g.id); } };

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const keys = new Set(), pressed = new Set(); // held keys, and presses not handled yet
const JUMP_KEYS = ["w", "arrowup", " ", "k", "pad:jump"];
/** [direction -1..1, jump pressed this frame] from the keys or the buttons. */
function myInput() {
  const dir = (keys.has("arrowright") || keys.has("d") || keys.has("pad:right") ? 1 : 0) - (keys.has("arrowleft") || keys.has("a") || keys.has("pad:left") ? 1 : 0);
  const jump = JUMP_KEYS.some((k) => pressed.has(k) || keys.has(k)); // holding jump keeps hopping
  if (jump && me.y <= 0) sfx("jump");
  pressed.clear();
  return [dir, jump];
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); unlockAudio();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  if (!e.repeat) pressed.add(k);
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); });
$("move").hidden = $("acts").hidden = !touchUI;
for (const b of document.querySelectorAll(".pad button")) {
  const k = "pad:" + b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); b.setPointerCapture(e.pointerId); keys.add(k); pressed.add(k); b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { keys.delete(k); b.classList.remove("on"); });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.wasHost = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncViews(dt);
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(dt, g, now);
    draw(g, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(g, now); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (msg, from) => { if (isHost() && msg) applyHit(msg, from); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { teamSize: 2, servePause: 400, pointMs: 700, pointsToWin: 99, botMiss: 0.35, botReact: 400 });
  requestAnimationFrame(frame);
})();
</script>
